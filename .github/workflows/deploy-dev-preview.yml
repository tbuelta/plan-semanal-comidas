

unable to access 'https://github.com/TamarBS/plan-comidas-semanal.git/': The requested URL returned error: 403

A 403 error when cloning/pulling from GitHub usually means GitHub understood your request but is refusing access. For a repo like
https://github.com/TamarBS/plan-comidas-semanal.git, the most common causes are these:

1️⃣ Repository is private
If the repository is private, GitHub will return 403 unless you authenticate.

Fix
Clone using authentication:

Using HTTPS with token

git clone https://<USERNAME>:<TOKEN>@github.com/TamarBS/plan-comidas-semanal.git
Or just:

git clone https://github.com/TamarBS/plan-comidas-semanal.git
Then Git will ask for:

Username

Personal Access Token (PAT) instead of password.

You can create a token in:
GitHub → Settings → Developer settings → Personal access tokens.

2️⃣ You don’t have permission
If the repo belongs to someone else (TamarBS) and it's private:

You must be added as a collaborator.

Ask the owner to:

Repo → Settings → Collaborators → Add your GitHub username
3️⃣ Wrong remote URL
Sometimes the URL contains a typo or extra slash.

❌ Wrong:

https://github.com/TamarBS/plan-comidas-semanal.git/
✅ Correct:

https://github.com/TamarBS/plan-comidas-semanal.git
Notice no trailing slash.

4️⃣ Using HTTPS but repo requires SSH
Try cloning with SSH instead:

git clone git@github.com:TamarBS/plan-comidas-semanal.git
But this only works if your SSH key is added to GitHub.

5️⃣ Cached wrong credentials
Git might be using old credentials.

Clear them:

git credential reject
Or remove them from your OS credential manager.

✅ Quick test:
Open this in a browser:

https://github.com/TamarBS/plan-comidas-semanal
If you see 404 → repo is private or doesn't exist.

If it loads → problem is authentication.

💡 If you want, paste the exact git command you ran and I can pinpoint the issue in seconds.


creo que el problema viene de que moví la carpeta en mi local de C:// a una subcarpeta de C:// Con esto te ayuda a entender cómo solucionar el error?

Sí, eso puede causar problemas, pero normalmente no genera un 403. Un 403 viene de GitHub (permisos/autenticación), mientras que mover una carpeta local suele causar errores como path not found o not a git repository. Aun así, veamos lo más probable.

1️⃣ Comprueba que sigues dentro del repositorio Git
En la carpeta que moviste ejecuta:

git status
Si funciona, el repo sigue bien.

Si aparece algo como:

fatal: not a git repository
significa que moviste la carpeta sin la carpeta oculta .git.

Solución: vuelve a clonar el repo.

2️⃣ Revisa el remote configurado
Después de mover carpetas a veces el remote queda raro. Ejecuta:

git remote -v
Deberías ver algo como:

origin  https://github.com/TamarBS/plan-comidas-semanal.git (fetch)
origin  https://github.com/TamarBS/plan-comidas-semanal.git (push)
Si aparece la URL con / al final:

...plan-comidas-semanal.git/
corrígela:

git remote set-url origin https://github.com/TamarBS/plan-comidas-semanal.git
3️⃣ Reautenticar con GitHub
Un 403 suele aparecer porque GitHub ya no acepta contraseña y requiere token.

Prueba:

git pull
Si te pide credenciales:

user → tu usuario de GitHub

password → Personal Access Token

4️⃣ Prueba rápida
Desde esa carpeta ejecuta:

git pull origin main
(o master dependiendo del repo)

✅ Resumen: mover la carpeta no debería causar un 403, así que probablemente sea:

credenciales guardadas incorrectamente

token de GitHub

remote URL mal configurado

💡 Si quieres, pásame el resultado de estos dos comandos y te digo exactamente qué está pasando:

git remote -v
git status

al hacer git status dice: Your branch is ahead of 'origin/dev' by 4 commits.
  (use "git push" to publish your local commits)

Untracked files:
  (use "git add <file>..." to include in what will be committed)
        plan-comidas-semanal/

nothing added to commit but untracked files present (use "git add" to trac

Tu git status muestra dos cosas distintas pasando en tu repo:

Your branch is ahead of 'origin/dev' by 4 commits.
✅ Esto significa que tienes 4 commits locales que todavía no se han subido a GitHub.

Git te está diciendo que deberías hacer:

git push
Pero como antes recibías 403, lo más probable es que el problema sea autenticación con GitHub, no la carpeta movida.

1️⃣ Intenta hacer push
Desde esa carpeta ejecuta:

git push origin dev
Si vuelve a salir 403, entonces el problema es:

permisos del repo

autenticación (token)

repo privado

2️⃣ Sobre el mensaje de Untracked files
También aparece esto:

Untracked files:
    plan-comidas-semanal/
Eso significa que dentro de tu repo hay otra carpeta nueva que Git no está siguiendo.

Probablemente al mover carpetas hiciste algo como:

plan-comidas-semanal
 ├─ .git
 └─ plan-comidas-semanal/
(es decir, un repo dentro de otro).

Puedes comprobarlo con:

ls
Si ves una carpeta duplicada, probablemente sea eso.

3️⃣ Solución si es carpeta duplicada
Si tu repo ahora tiene esta estructura:

plan-comidas-semanal/
   .git
   plan-comidas-semanal/
      archivos...
mueve los archivos:

mv plan-comidas-semanal/* .
rm -rf plan-comidas-semanal
Luego:

git add .
git commit -m "Fix folder structure"
git push origin dev
✅ La clave:

Tu repo sí está funcionando (Git reconoce commits).

El problema no viene del movimiento de carpeta, sino probablemente del push con credenciales.

💡 Si quieres, pega también el resultado de:

git remote -v
porque ahí casi siempre se ve exactamente por qué aparece el 403.


