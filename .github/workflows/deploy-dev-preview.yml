fatal: unable to access 'https://github.com/TamarBS/plan-comidas-semanal.git/': The requested URL returned error: 403

El 403 ya nos dice casi seguro qué pasa: GitHub está rechazando tu autenticación, no es un problema de mover carpetas. Vamos a comprobarlo paso a paso.

1️⃣ Comprueba la URL del repositorio
Ejecuta:

git remote -v
Debería salir algo como:

origin  https://github.com/TamarBS/plan-comidas-semanal.git (fetch)
origin  https://github.com/TamarBS/plan-comidas-semanal.git (push)
Si aparece con / al final:

...plan-comidas-semanal.git/
corrígelo:

git remote set-url origin https://github.com/TamarBS/plan-comidas-semanal.git
2️⃣ Lo más común: credenciales de GitHub guardadas incorrectamente
Git en Windows suele guardar credenciales antiguas. Hay que borrarlas.

Abre Administrador de credenciales de Windows
Panel de control

Administrador de credenciales

Credenciales de Windows

Busca entradas que contengan:

git:https://github.com
Eliminar

