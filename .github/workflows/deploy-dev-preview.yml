tengo una web pública creada en github para ver mi proyecto que tira de la rama main. Quiero crear otra url diferente en la que me deje ver un preview de otra rama de desarrollo llamada dev. Así puedo comprobar que todo va bien antes de hacer el merge con main. ¿Esto se puede hacer en github la versión free?

Sí 👍 se puede, pero GitHub Pages (gratis) tiene una limitación importante:
un repositorio solo puede tener un sitio de Pages activo a la vez (normalmente desde main, gh-pages o /docs). No puedes tener dos URLs de Pages desde ramas distintas del mismo repo directamente.

Pero hay 3 soluciones comunes para tener preview de dev.

✅ Opción 1 (recomendada): usar un segundo repositorio solo para preview
Es la forma más simple en GitHub Free.

Idea
Repo principal → producción (main)

Repo preview → despliega la rama dev

Ejemplo
Repo producción

plan-comidas-semanal
Repo preview

plan-comidas-semanal-dev
URL:

https://tamarbs.github.io/plan-comidas-semanal
https://tamarbs.github.io/plan-comidas-semanal-dev
Cada uno publica una rama distinta.

✅ Opción 2: usar GitHub Actions para desplegar dev a otra carpeta
Puedes hacer que dev se publique en un subpath del mismo sitio.

Ejemplo:

https://tamarbs.github.io/plan-comidas-semanal/      → main
https://tamarbs.github.io/plan-comidas-semanal/dev   → dev preview
Esto se hace con un workflow que:

al hacer push a dev

copia el build a /dev dentro de gh-pages.

Es bastante usado en proyectos frontend.

✅ Opción 3 (muy usada en frontend): usar Vercel o Netlify
Esto te da previews automáticos de cada rama.

Ejemplo con Vercel:

main → plan-comidas-semanal.vercel.app
dev  → plan-comidas-semanal-git-dev.vercel.app
Y cada PR crea un preview.

Lo mismo con Netlify.

Ventajas:

preview automático por rama

no tienes que configurar GitHub Actions

muy usado en proyectos React/Vue/Next.

💡 Recomendación realista
Para un proyecto personal:

👉 Vercel suele ser la opción más cómoda.

Flujo típico:

dev branch → preview automática
main branch → producción
Sin tocar GitHub Pages.

✅ Si quieres, también puedo enseñarte una técnica muy usada por desarrolladores:

deploy automático de dev a /preview con GitHub Actions en 2 minutos (copiar y pegar un workflow).
Es probablemente la solución más profesional usando solo GitHub.


explícame paso a paso como hacer esto: ✅ Opción 2: usar GitHub Actions para desplegar dev a otra carpeta

Te explico paso a paso cómo tener:

🌐 Producción → main

🧪 Preview → dev

En URLs como:

https://TUUSUARIO.github.io/plan-comidas-semanal/
https://TUUSUARIO.github.io/plan-comidas-semanal/dev/
usando GitHub, GitHub Pages y GitHub Actions.

1️⃣ Configurar GitHub Pages
Primero asegúrate de que tu web ya se publica desde main.

Ve a tu repositorio en GitHub

Settings

Pages

En Source selecciona:

Deploy from a branch
Selecciona:

Branch: main
Folder: / (root)
Tu web seguirá funcionando en:

https://TUUSUARIO.github.io/plan-comidas-semanal/
2️⃣ Crear la carpeta de workflows
En tu proyecto crea esta estructura:

.github
   workflows
Puedes hacerlo desde tu editor o con terminal.

3️⃣ Crear el workflow de preview
Dentro crea este archivo:

.github/workflows/deploy-dev-preview.yml
4️⃣ Pegar este código
Este workflow hará:

cuando hagas push a dev

copia los archivos a una carpeta /dev

los publica en Pages

name: Deploy dev preview

on:
  push:
    branches:
      - dev

jobs:
  deploy-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create dev folder
        run: |
          mkdir build
          cp -r * build/ || true
          mkdir -p build/dev
          cp -r * build/dev/ || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
5️⃣ Hacer commit del workflow
git add .github/workflows/deploy-dev-preview.yml
git commit -m "Add dev preview deployment"
git push origin dev
6️⃣ Esperar a que corra la Action
Ve a la pestaña:

Actions
Verás ejecutarse el workflow.

Cuando termine, tu preview estará en:

https://TUUSUARIO.github.io/plan-comidas-semanal/dev/
7️⃣ Flujo final de trabajo
Tu flujo quedará así:

dev → preview
main → producción
Ejemplo:

dev branch
   ↓
preview URL

merge → main
   ↓
producción
💡 Mejora muy usada
Muchos equipos añaden también:

/staging
/pr-preview
para revisar PRs antes del merge.

✅ Si quieres, también puedo enseñarte una versión aún más limpia que usan muchos devs:

main → producción
dev → preview automático
feature branches → preview temporal
y queda mucho más profesional para portfolio.


al hacer push del commit a dev me sale este error en github:   Error: Action failed with "The process '/usr/bin/git' failed with exit code 128"

Ese error exit code 128 en una workflow de GitHub Actions normalmente ocurre cuando la action intenta hacer un push a una rama que no puede modificar o cuando la configuración de GitHub Pages no coincide con la rama donde se está publicando.

En tu caso es muy probable que pase esto:

Pages está configurado para main

la action intenta publicar contenido generado

Git falla al hacer push → exit code 128

La solución más estable es usar una rama gh-pages para el despliegue (es el flujo estándar).

✅ Solución paso a paso (la que menos problemas da)
1️⃣ Cambiar la rama de GitHub Pages
En tu repo:

Settings

Pages

En Source selecciona:

Deploy from a branch
y cambia a:

Branch: gh-pages
Folder: / (root)
Guarda.

2️⃣ Actualizar el workflow
Edita tu archivo:

.github/workflows/deploy-dev-preview.yml
y usa este código (más simple y estable):

name: Deploy dev preview

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prepare preview
        run: |
          mkdir public
          cp -r * public/ || true
          mkdir -p public/dev
          cp -r * public/dev/ || true

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
3️⃣ Subir los cambios
git add .github/workflows/deploy-dev-preview.yml
git commit -m "Fix preview deploy"
git push origin dev
4️⃣ Esperar a que se ejecute
Ve a:

Repo → Actions
Cuando termine, tendrás:

Producción (cuando hagas deploy desde main):

https://TUUSUARIO.github.io/plan-comidas-semanal/
Preview dev:

https://TUUSUARIO.github.io/plan-comidas-semanal/dev/
🔎 Si vuelve a fallar
Entra en:

Actions → workflow → deploy step
y copia las últimas 10-15 líneas del error, porque exit code 128 puede ser también por:

intentar copiar la carpeta .git

conflicto con archivos existentes

permisos del token

y con ese log se ve inmediatamente.

💡 Si quieres, también puedo enseñarte una forma mucho más limpia (la que usan muchos devs) para tener:

main → producción
dev → preview automático
cada PR → preview temporal
y queda muy profesional para portfolio.


